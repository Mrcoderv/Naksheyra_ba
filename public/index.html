<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Nakshatra Business Advisory — financial planning, tax advisory, governance, and business consulting in Kathmandu, Nepal."><meta property="og:title" content="Nakshatra Business Advisory"><meta property="og:description" content="Plan today. Prosper tomorrow."><meta property="og:image" content="/nakshatra-logo.png"><link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png"><link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png"><link rel="apple-touch-icon" href="/apple-icon.png"><meta name="theme-color" content="#0b1b3d"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><title>Nakshatra Business Advisory</title><style>:root{--navy:#0b1b3d;--green:#0a7e39;--red:#6e0e14;--gold:#8a6d12;--gold-bright:#e3bd4e;--paper:#f8f9fa;--ink-muted:#4a5670;--on-dark-muted:#c7d0df;--on-dark-soft:#9aa6bb}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(1200px 620px at 82% -12%,#0a7e390f,transparent 60%),var(--paper);color:var(--navy);font:16px Inter,system-ui,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}h1,h2{font-family:Fraunces,Georgia,"Times New Roman",serif}a{color:inherit;text-decoration:none}.wrap{max-width:1120px;margin:auto;padding:0 24px}.top{background:var(--navy);color:#fff;text-align:center;padding:9px;font-size:11px;letter-spacing:.16em}.nav{position:sticky;top:0;z-index:5;background:#f8f9faf2;border-bottom:1px solid #0b1b3d1a;backdrop-filter:blur(10px)}.navin{display:flex;align-items:center;justify-content:space-between;padding:14px 0}.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.15em}.brand img{width:62px;height:46px;object-fit:contain}.links{display:flex;gap:25px;font-size:14px;font-weight:bold}.btn{display:inline-block;border-radius:999px;background:var(--green);color:#fff;padding:14px 22px;font-weight:700;letter-spacing:.005em;transition:transform .2s ease,box-shadow .2s ease,background .2s ease}.btn:hover{transform:translateY(-2px);box-shadow:0 14px 28px -12px #0a7e3988}.btn.ghost{background:#fff;color:var(--navy);border:1px solid #0b1b3d1f}.btn.ghost:hover{background:#fff;box-shadow:0 12px 26px -16px #0b1b3d55;border-color:#0a7e3955}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:55px;align-items:center;padding:100px 0}.eyebrow{text-transform:uppercase;color:var(--gold);letter-spacing:.18em;font-size:13px;font-weight:bold}.hero h1{font-size:clamp(48px,7vw,82px);line-height:1.02;letter-spacing:-.02em;margin:18px 0}.hero h1 span{color:var(--green)}.hero p{max-width:570px;color:var(--ink-muted);line-height:1.8;font-size:18px}.panel{border-radius:30px;background:linear-gradient(150deg,#17305e99,#0b1b3dcc),url('/eyeimage.png') center/contain no-repeat;color:#fff;padding:42px;min-height:390px;display:flex;flex-direction:column;justify-content:space-between}.panel strong{color:#fff;font-size:42px}.section{padding:100px 0}.section h2{font-size:clamp(34px,5vw,58px);line-height:1.08;letter-spacing:-.015em;margin:0 0 30px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.card{background:#fff;border:1px solid #0b1b3d14;border-radius:24px;padding:25px;box-shadow:0 1px 2px #0b1b3d0a,0 16px 38px -22px #0b1b3d33;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}.card:hover{transform:translateY(-4px);border-color:#0a7e3940;box-shadow:0 1px 2px #0b1b3d0a,0 26px 54px -24px #0b1b3d3d}.card h3{font-size:22px;margin:0 0 10px;letter-spacing:-.01em}.card p{color:var(--ink-muted);line-height:1.7}.dark{background:var(--navy);color:#fff}.dark .card{color:var(--navy)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.stats strong{font-size:38px;color:#7bc497}.stats small{opacity:.75}.video{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center}.video iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:24px}.quotes{grid-template-columns:repeat(2,1fr)}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.gallery figure{margin:0;border-radius:20px;overflow:hidden;background:#fff;border:1px solid #0b1b3d1a}.gallery img{width:100%;height:210px;object-fit:cover;display:block}.gallery figcaption{padding:12px 14px;font-size:13px;color:var(--ink-muted)}.faq .row{border-top:1px solid #0b1b3d1a;padding:18px 0}.faq button{all:unset;cursor:pointer;font-weight:bold;display:flex;justify-content:space-between;gap:16px;width:100%}.faq .ans{margin-top:10px;color:var(--ink-muted);line-height:1.7;font-size:14px;max-width:640px}.posts small,.card small.tag{color:var(--green);font-weight:bold;text-transform:uppercase;letter-spacing:.08em;font-size:11px}.team-slide{background:#fff;border:1px solid #0b1b3d1a;border-radius:24px;overflow:hidden;padding:0;box-shadow:0 6px 22px #0b1b3d0f;transition:box-shadow .25s ease}.team-slide:hover{box-shadow:0 18px 40px #0b1b3d1f}.team-photo{position:relative;width:100%;aspect-ratio:4/5;background:#eef1f3;overflow:hidden}.team-photo img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;transition:transform .5s ease}.team-slide:hover .team-photo img{transform:scale(1.05)}.team-initials{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-weight:900;color:#0b1b3d40}.team-body{border-top:1px solid #0b1b3d1a;padding:18px 20px}.team-body h3{margin:0;font-size:19px;line-height:1.25}.team-role{margin-top:5px;color:var(--green);font-weight:bold;font-size:14px}footer{background:var(--navy);color:#fff;padding:45px 0}.modal{position:fixed;inset:0;background:#0b1b3dcc;display:grid;place-items:center;padding:20px;z-index:10}.modalbox{background:#fff;border-radius:25px;padding:30px;max-width:480px;max-height:90vh;overflow:auto}.doc-label{display:block;margin:18px 0 7px;font-size:11px;font-weight:bold;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-muted)}.doc-preview{border:1px solid #0b1b3d1a;border-radius:14px;overflow:hidden;background:#f1f3f5}.doc-preview iframe{width:100%;height:250px;border:0;display:block}.doc-preview img{width:100%;max-height:270px;object-fit:contain;display:block;background:#fff}.close{float:right;border:0;background:none;font-size:24px;cursor:pointer}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:20;opacity:0;transition:opacity .3s}.toast.show{opacity:1}@media(max-width:760px){.links{display:none}.hero,.video{grid-template-columns:1fr;padding:65px 0}.grid,.stats,.gallery{grid-template-columns:repeat(2,1fr)}.panel{min-height:300px;padding:30px}.section{padding:65px 0}}@media(max-width:480px){.grid,.stats,.quotes,.gallery{grid-template-columns:1fr}.hero h1{font-size:54px}}.team-slider{position:relative}.team-viewport{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;padding-bottom:6px}.team-viewport::-webkit-scrollbar{display:none}.team-slide{scroll-snap-align:start;flex:0 0 calc((100% - 32px)/3);box-sizing:border-box;margin:0}.team-nav{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}.team-nav button{width:42px;height:42px;border-radius:999px;border:1px solid #0b1b3d1a;background:#fff;color:var(--navy);font-size:22px;line-height:1;cursor:pointer}.team-nav button:hover{background:var(--green);color:#fff}@media(max-width:900px){.team-slide{flex:0 0 calc((100% - 16px)/2)}}@media(max-width:600px){.team-slide{flex:0 0 100%}}@keyframes nbaUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}.hero,.section{animation:nbaUp .6s ease both}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.hero,.section{animation:none}}@media(min-width:761px){.navin{padding:22px 0}.brand{gap:14px}.brand img{width:82px;height:62px}.brand span{font-size:18px}.links{gap:34px;font-size:16px}.navin>.btn{padding:16px 28px;font-size:15px}}.brand span{display:inline-block;line-height:1.15}</style></head><body><div id="app"></div><div id="notice"></div><div id="toast" class="toast">Content updated</div><script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BRAND_NAME='NAKSHATRA',BRAND_LOGO='/nakshatra-logo.png';
const enabled=x=>!x||x.enabled!==false;
const on=list=>Array.isArray(list)?list.filter(enabled):[];
function section(id,eyebrow,title,body){return `<section id="${id}" class="wrap section"><div class="eyebrow">${esc(eyebrow)}</div><h2>${esc(title)}</h2>${body}</section>`}
function build(c){
  const b=c.brand||{},hero=c.hero||{},top=c.topBar||{};
  let h='';
  if(enabled(top))h+=`<div class="top">${esc(top.text)}</div>`;
  h+=`<header class="nav"><div class="wrap navin"><a class="brand" href="#top"><img src="${BRAND_LOGO}" alt="${BRAND_NAME} logo"><span>${BRAND_NAME}<br><small style="color:var(--red);font-size:9px">${esc(b.tagline||'')}</small></span></a><nav class="links"><a href="#services">Services</a><a href="#about">Our approach</a><a href="#insights">Insights</a><a href="#contact">Contact</a></nav><a class="btn" href="#contact">Book a consultation</a></div></header>`;
  h+='<main id="top">';
  if(enabled(hero))h+=`<section class="wrap hero"><div>${hero.eyebrow?`<div class="eyebrow">${esc(hero.eyebrow)}</div>`:''}<h1>${esc(hero.title)}<br><span>${esc(hero.highlight)}</span></h1><p>${esc(hero.subtitle)}</p><div style="margin-top:26px;display:flex;gap:12px;flex-wrap:wrap"><a class="btn" href="${esc(hero.primaryHref||'#contact')}">${esc(hero.primaryLabel||'Get started')} →</a><a class="btn ghost" href="${esc(hero.secondaryHref||'#services')}">${esc(hero.secondaryLabel||'Learn more')}</a></div></div><div class="panel"><small>NBA / ADVISORY BRIEF</small><div><strong>${esc(hero.statValue||'')}</strong><br><small>${esc(hero.statLabel||'')}</small><h2>Good advice makes growth feel possible.</h2></div><small>Finance · Tax · Strategy · Governance</small></div></section>`;
  const ach=on(c.achievements&&c.achievements.items);
  if(enabled(c.achievements)&&ach.length)h+=`<section class="dark"><div class="wrap stats" style="padding-top:38px;padding-bottom:38px">${ach.map(x=>`<div><strong>${esc(x.value)}</strong><br><small>${esc(x.label)}</small></div>`).join('')}</div></section>`;
  const svc=on(c.services&&c.services.items);
  if(enabled(c.services)&&svc.length)h+=section('services',(c.services.eyebrow||'What we do'),(c.services.title||'Services'),`<div class="grid">${svc.map((x,i)=>`<article class="card"><small class="tag">NBA / ${String(i+1).padStart(2,'0')}</small><h3>${esc(x.title)}</h3><p>${esc(x.summary||x.text||'')}</p>${x.details?`<details><summary>View details</summary><p>${esc(x.details)}</p></details>`:''}</article>`).join('')}</div>`);
  const ap=c.approach||{},steps=on(ap.steps);
  if(enabled(ap))h+=`<section id="about" class="dark section"><div class="wrap video"><div><div class="eyebrow" style="color:var(--gold-bright)">${esc(ap.eyebrow)}</div><h2>${esc(ap.title)}</h2><p style="color:var(--on-dark-muted);line-height:1.8">${esc(ap.subtitle)}</p><a class="btn" style="margin-top:20px" href="${esc(ap.ctaHref||'#contact')}">${esc(ap.ctaLabel||'Contact us')}</a></div><div class="grid" style="grid-template-columns:1fr;gap:12px">${steps.map((s,i)=>`<div class="card" style="background:#ffffff0d;border-color:#ffffff1a;color:#fff"><div style="font-size:30px;font-weight:900;color:#7bc497">${String(i+1).padStart(2,'0')}</div><h3>${esc(s.title)}</h3><p style="color:var(--on-dark-soft)">${esc(s.text)}</p></div>`).join('')}</div></div></section>`;
  const team=on(c.directorAndTeam&&c.directorAndTeam.members);
  if(enabled(c.directorAndTeam)&&team.length)h+=section('director',(c.directorAndTeam.eyebrow||'Our team'),(c.directorAndTeam.title||'Meet the team'),`<p style="max-width:640px;color:var(--ink-muted);line-height:1.8">${esc(c.directorAndTeam.subtitle||'')}</p><div class="team-slider" style="margin-top:24px"><div class="team-viewport" id="teamViewport">${team.map(m=>{const init=(m.name||'').split(/\s+/).filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase();return `<article class="card team-slide"><div class="team-photo">${m.imageUrl?`<img src="${esc(m.imageUrl)}" alt="${esc(m.name)}" loading="lazy">`:`<span class="team-initials">${esc(init)}</span>`}</div><div class="team-body"><h3>${esc(m.name)}</h3><div class="team-role">${esc(m.title)}</div></div></article>`;}).join('')}</div>${team.length>1?`<div class="team-nav"><button type="button" onclick="nbaTeam(-1)" aria-label="Previous team member">‹</button><button type="button" onclick="nbaTeam(1)" aria-label="Next team member">›</button></div>`:''}</div>`);
  const gal=on(c.gallery&&c.gallery.items);
  if(enabled(c.gallery)&&gal.length)h+=section('gallery',(c.gallery.eyebrow||'Gallery'),(c.gallery.title||'Gallery'),`<div class="gallery">${gal.map(g=>`<figure><img src="${esc(g.imageUrl)}" alt="${esc(g.caption)}">${g.caption?`<figcaption>${esc(g.caption)}</figcaption>`:''}</figure>`).join('')}</div>`);
  const vids=on(c.highlightedVideo&&c.highlightedVideo.items);
  if(enabled(c.highlightedVideo)&&vids.length)h+=`<section id="insights" class="wrap section"><div class="eyebrow">${esc(c.highlightedVideo.eyebrow||'Advisory insights')}</div><h2>${esc(c.highlightedVideo.title||'Briefings')}</h2>${vids.map(v=>`<div class="video" style="margin-bottom:40px"><div><h3 style="font-size:26px;margin:0 0 10px">${esc(v.title)}</h3><p style="color:var(--ink-muted);line-height:1.8">${esc(v.description)}</p></div><iframe src="${esc(v.embedUrl)}" title="${esc(v.title)}" loading="lazy" allowfullscreen></iframe></div>`).join('')}${tst(c)}</section>`;
  else h+=`<section id="insights" class="wrap section">${tst(c)}</section>`;
  const posts=on(c.posts&&c.posts.items);
  if(enabled(c.posts)&&posts.length)h+=section('posts',(c.posts.eyebrow||'Insights & guides'),(c.posts.title||'Latest'),`<div class="grid">${posts.map(p=>`<article class="card posts"><small>${esc(p.category)}</small><h3>${esc(p.title)}</h3><p style="color:var(--ink-muted)">${esc(p.publicationDate)}</p><a href="${esc(p.downloadUrl||'#contact')}" style="color:var(--green);font-weight:bold">Read / Download →</a></article>`).join('')}</div>`);
  const faq=on(c.faqs&&c.faqs.items);
  if(enabled(c.faqs)&&faq.length)h+=`<section class="wrap section faq"><div class="eyebrow">${esc(c.faqs.eyebrow||'FAQ')}</div><h2>${esc(c.faqs.title||'Questions, answered.')}</h2>${faq.map((f,i)=>`<div class="row"><button onclick="nbaToggle(${i})"><span>${esc(f.question)}</span><span style="color:var(--green)">▾</span></button><div class="ans" id="faq-${i}" style="display:none">${esc(f.answer)}</div></div>`).join('')}</section>`;
  const ct=c.contact||{};
  if(enabled(ct))h+=`<section id="contact" class="dark section"><div class="wrap video"><div><div class="eyebrow" style="color:var(--gold-bright)">${esc(ct.eyebrow)}</div><h2>${esc(ct.title)}</h2><p style="color:var(--on-dark-muted);line-height:1.8">${esc(ct.subtitle)}</p><p style="margin-top:18px;color:#ffffffcc">${esc(ct.note)}</p><p style="margin-top:18px;color:#ffffffcc">${ct.address?`📍 ${esc(ct.address)}<br>`:''}${ct.email?`✉️ ${esc(ct.email)}<br>`:''}${ct.phone?`📞 ${esc(ct.phone)}`:''}</p></div><form id="contact-form" class="card"><input required name="name" placeholder="Your name" style="width:100%;padding:14px;margin-bottom:12px;border:1px solid #0b1b3d1a;border-radius:12px"><input required type="email" name="email" placeholder="Email address" style="width:100%;padding:14px;margin-bottom:12px;border:1px solid #0b1b3d1a;border-radius:12px"><input type="tel" name="phone" placeholder="Phone number (optional)" style="width:100%;padding:14px;margin-bottom:12px;border:1px solid #0b1b3d1a;border-radius:12px"><textarea required name="message" placeholder="How can we help?" rows="5" style="width:100%;padding:14px;margin-bottom:12px;border:1px solid #0b1b3d1a;border-radius:12px"></textarea><button class="btn" type="submit">Send enquiry</button><p id="contact-status" style="margin:12px 0 0;font-size:14px;font-weight:600"></p></form></div>${ct.mapUrl?`<div class="wrap" style="padding-top:0;padding-bottom:40px"><iframe src="${esc(ct.mapUrl)}" title="${esc(ct.mapTitle||'Office location map')}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen style="width:100%;height:380px;border:0;border-radius:24px"></iframe></div>`:''}</section>`;
  h+='</main>';
  const f=c.footer||{};
  if(enabled(f))h+=`<footer><div class="wrap"><strong>${BRAND_NAME}</strong> · ${esc(f.tagline)}<br><small style="color:var(--on-dark-soft)">${esc(f.note)}</small><p style="color:var(--on-dark-soft);font-size:12px;margin-top:18px">${esc(f.copyright)}</p></div></footer>`;
  return h;
}
function tst(c){const t=on(c.testimonials&&c.testimonials.items);if(!enabled(c.testimonials)||!t.length)return '';return `<div style="margin-top:60px"><div class="eyebrow">${esc(c.testimonials.eyebrow||'Testimonials')}</div><h2>${esc(c.testimonials.title||'What clients say')}</h2><div class="grid quotes">${t.map(x=>`<article class="card"><p>“${esc(x.quote)}”</p><strong>${esc(x.clientName)}</strong><br><small style="color:var(--ink-muted)">${esc(x.company)}</small></article>`).join('')}</div></div>`}
window.nbaToggle=function(i){const el=document.getElementById('faq-'+i);if(el)el.style.display=el.style.display==='none'?'block':'none';};
window.nbaTeam=function(dir){const v=document.getElementById('teamViewport');if(!v)return;const card=v.firstElementChild;if(!card)return;const step=card.getBoundingClientRect().width+16;v.scrollBy({left:dir*step,behavior:'smooth'});};
setInterval(function(){const v=document.getElementById('teamViewport');if(!v)return;const card=v.firstElementChild;if(!card)return;if(v.scrollWidth<=v.clientWidth+4)return;const step=card.getBoundingClientRect().width+16;if(v.scrollLeft+step>=v.scrollWidth-4)v.scrollTo({left:0,behavior:'smooth'});else v.scrollBy({left:step,behavior:'smooth'});},5000);
function notice(c){if(!enabled(c.notificationPopup))return;if(sessionStorage.getItem('nba_notice')==='seen')return;const n=c.notificationPopup;const u=n.documentUrl||'';const isPdf=/\.pdf(\?|#|$)/i.test(u);const isImg=/\.(png|jpe?g|webp|gif|avif)(\?|#|$)/i.test(u);const preview=(isPdf||isImg)?`<span class="doc-label">Preview</span><div class="doc-preview">${isPdf?`<iframe src="${esc(u)}#toolbar=0&navpanes=0&view=FitH" title="Document preview" loading="lazy"></iframe>`:`<img src="${esc(u)}" alt="Document preview" loading="lazy">`}</div>`:'';document.querySelector('#notice').innerHTML=`<div class="modal"><div class="modalbox"><button class="close" onclick="this.closest('.modal').remove()">×</button><div class="eyebrow">NBA update</div><h2>${esc(n.title)}</h2><p>${esc(n.message)}</p>${preview}${u?`<a class="btn" style="margin-top:18px" href="${esc(u)}" target="_blank" rel="noopener" onclick="sessionStorage.setItem('nba_notice','seen')">${esc(n.buttonLabel)}</a>`:''}</div></div>`}
function upsertMeta(attr,key,value){if(!value)return;let el=document.head.querySelector(`meta[${attr}="${key}"]`);if(!el){el=document.createElement('meta');el.setAttribute(attr,key);document.head.appendChild(el)}el.setAttribute('content',value)}
function applySeo(c){const s=c.seo;if(!s||s.enabled===false)return;if(s.title)document.title=s.title;upsertMeta('name','description',s.description);upsertMeta('name','keywords',s.keywords);upsertMeta('property','og:title',s.title);upsertMeta('property','og:description',s.description);upsertMeta('property','og:image',s.ogImage)}
let latest='',booted=false;
async function load(){try{const r=await fetch('/api/content',{cache:'no-store'});const data=await r.json();const sig=JSON.stringify(data);if(sig!==latest){latest=sig;document.querySelector('#app').innerHTML=build(data);applySeo(data);if(!booted)notice(data);booted=true;if(latest&&document.querySelector('#toast')){const t=document.querySelector('#toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}}}catch(e){if(!booted)document.querySelector('#app').innerHTML='<div style="padding:60px;text-align:center;font-family:Arial">Content API unavailable. Start the CMS server with <b>node server.js</b>.</div>'}}
document.addEventListener('submit',async function(e){const f=e.target;if(!f||f.id!=='contact-form')return;e.preventDefault();const btn=f.querySelector('button[type="submit"]');const status=f.querySelector('#contact-status');const data={name:f.elements.name.value.trim(),email:f.elements.email.value.trim(),phone:f.elements.phone.value.trim(),message:f.elements.message.value.trim()};const old=btn.textContent;btn.disabled=true;btn.textContent='Sending…';status.style.color='var(--ink-muted)';status.textContent='';try{const r=await fetch('/api/contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json().catch(()=>({ok:false}));if(r.ok&&j.ok){f.reset();status.style.color='var(--green)';status.textContent='Thank you — your enquiry has been sent. We will be in touch shortly.'}else{status.style.color='#b3261e';status.textContent=(j&&j.error)||'Something went wrong. Please try again.'}}catch(err){status.style.color='#b3261e';status.textContent='Network error. Please check your connection and try again.'}finally{btn.disabled=false;btn.textContent=old}});
load();setInterval(load,5000);
</script></body></html>
