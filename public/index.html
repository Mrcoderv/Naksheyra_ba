<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Nakshatra Business Advisory — financial planning, tax advisory, governance, and business consulting in Kathmandu, Nepal."><meta property="og:title" content="Nakshatra Business Advisory"><meta property="og:description" content="Plan today. Prosper tomorrow."><meta property="og:image" content="/nakshatra-logo.png"><title>Nakshatra Business Advisory</title><style>:root{--navy:#0b1b3d;--green:#0a7e39;--red:#6e0e14;--paper:#f8f9fa}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--navy);font:16px Arial,sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1120px;margin:auto;padding:0 24px}.top{background:var(--navy);color:#fff;text-align:center;padding:9px;font-size:11px;letter-spacing:.16em}.nav{position:sticky;top:0;z-index:5;background:#f8f9faf2;border-bottom:1px solid #0b1b3d1a;backdrop-filter:blur(10px)}.navin{display:flex;align-items:center;justify-content:space-between;padding:14px 0}.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.15em}.brand img{width:62px;height:46px;object-fit:contain}.links{display:flex;gap:25px;font-size:14px;font-weight:bold}.btn{display:inline-block;border-radius:999px;background:var(--green);color:#fff;padding:14px 20px;font-weight:bold}.btn.ghost{background:#fff;color:var(--navy);border:1px solid #0b1b3d1a}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:55px;align-items:center;padding:100px 0}.eyebrow{text-transform:uppercase;color:var(--red);letter-spacing:.18em;font-size:12px;font-weight:bold}.hero h1{font-size:clamp(48px,7vw,82px);line-height:.96;letter-spacing:-.06em;margin:20px 0}.hero h1 span{color:var(--green)}.hero p{max-width:570px;color:#0b1b3db3;line-height:1.8;font-size:18px}.panel{border-radius:30px;background:var(--navy);color:#fff;padding:42px;min-height:390px;display:flex;flex-direction:column;justify-content:space-between}.panel strong{color:#7bc497;font-size:42px}.section{padding:90px 0}.section h2{font-size:clamp(34px,5vw,58px);line-height:1.05;letter-spacing:-.05em;margin:0 0 30px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #0b1b3d1a;border-radius:24px;padding:25px}.card h3{font-size:23px;margin:0 0 10px}.card p{color:#0b1b3d99;line-height:1.7}.dark{background:var(--navy);color:#fff}.dark .card{color:var(--navy)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.stats strong{font-size:38px;color:#7bc497}.stats small{opacity:.75}.video{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center}.video iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:24px}.quotes{grid-template-columns:repeat(2,1fr)}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.gallery figure{margin:0;border-radius:20px;overflow:hidden;background:#fff;border:1px solid #0b1b3d1a}.gallery img{width:100%;height:210px;object-fit:cover;display:block}.gallery figcaption{padding:12px 14px;font-size:13px;color:#0b1b3d99}.faq .row{border-top:1px solid #0b1b3d1a;padding:18px 0}.faq button{all:unset;cursor:pointer;font-weight:bold;display:flex;justify-content:space-between;gap:16px;width:100%}.faq .ans{margin-top:10px;color:#0b1b3d99;line-height:1.7;font-size:14px;max-width:640px}.posts small,.card small.tag{color:var(--green);font-weight:bold;text-transform:uppercase;letter-spacing:.08em;font-size:11px}.team{grid-template-columns:repeat(3,1fr)}.team .card img{width:72px;height:72px;object-fit:contain;float:right}footer{background:var(--navy);color:#fff;padding:45px 0}.modal{position:fixed;inset:0;background:#0b1b3dcc;display:grid;place-items:center;padding:20px;z-index:10}.modalbox{background:#fff;border-radius:25px;padding:30px;max-width:480px}.close{float:right;border:0;background:none;font-size:24px;cursor:pointer}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:20;opacity:0;transition:opacity .3s}.toast.show{opacity:1}@media(max-width:760px){.links{display:none}.hero,.video{grid-template-columns:1fr;padding:65px 0}.grid,.stats,.gallery{grid-template-columns:repeat(2,1fr)}.panel{min-height:300px;padding:30px}.section{padding:65px 0}}@media(max-width:480px){.grid,.stats,.quotes,.gallery{grid-template-columns:1fr}.hero h1{font-size:54px}}</style></head><body><div id="app"></div><div id="notice"></div><div id="toast" class="toast">Content updated</div><script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const enabled=x=>!x||x.enabled!==false;
const on=list=>Array.isArray(list)?list.filter(enabled):[];
function section(id,eyebrow,title,body){return `<section id="${id}" class="wrap section"><div class="eyebrow">${esc(eyebrow)}</div><h2>${esc(title)}</h2>${body}</section>`}
function build(c){
  const b=c.brand||{},hero=c.hero||{},top=c.topBar||{};
  let h='';
  if(enabled(top))h+=`<div class="top">${esc(top.text)}</div>`;
  h+=`<header class="nav"><div class="wrap navin"><a class="brand" href="#top">${b.logoUrl?`<img src="${esc(b.logoUrl)}" alt="${esc(b.name)} logo">`:''}<span>${esc(b.name||'')}<br><small style="color:var(--red);font-size:9px">${esc(b.tagline||'')}</small></span></a><nav class="links"><a href="#services">Services</a><a href="#about">Our approach</a><a href="#insights">Insights</a><a href="#contact">Contact</a></nav><a class="btn" href="#contact">Book a consultation</a></div></header>`;
  h+='<main id="top">';
  if(enabled(hero))h+=`<section class="wrap hero"><div><div class="eyebrow">${esc(hero.eyebrow)}</div><h1>${esc(hero.title)}<br><span>${esc(hero.highlight)}</span></h1><p>${esc(hero.subtitle)}</p><div style="margin-top:26px;display:flex;gap:12px;flex-wrap:wrap"><a class="btn" href="${esc(hero.primaryHref||'#contact')}">${esc(hero.primaryLabel||'Get started')} →</a><a class="btn ghost" href="${esc(hero.secondaryHref||'#services')}">${esc(hero.secondaryLabel||'Learn more')}</a></div></div><div class="panel"><small>NBA / ADVISORY BRIEF</small><div><strong>${esc(hero.statValue||'')}</strong><br><small>${esc(hero.statLabel||'')}</small><h2>Good advice makes growth feel possible.</h2></div><small>Finance · Tax · Strategy · Governance</small></div></section>`;
  const ach=on(c.achievements&&c.achievements.items);
  if(enabled(c.achievements)&&ach.length)h+=`<section class="dark"><div class="wrap stats" style="padding-top:38px;padding-bottom:38px">${ach.map(x=>`<div><strong>${esc(x.value)}</strong><br><small>${esc(x.label)}</small></div>`).join('')}</div></section>`;
  const svc=on(c.services&&c.services.items);
  if(enabled(c.services)&&svc.length)h+=section('services',(c.services.eyebrow||'What we do'),(c.services.title||'Services'),`<div class="grid">${svc.map((x,i)=>`<article class="card"><small class="tag">NBA / ${String(i+1).padStart(2,'0')}</small><h3>${esc(x.title)}</h3><p>${esc(x.summary||x.text||'')}</p>${x.details?`<details><summary>View details</summary><p>${esc(x.details)}</p></details>`:''}</article>`).join('')}</div>`);
  const ap=c.approach||{},steps=on(ap.steps);
  if(enabled(ap))h+=`<section id="about" class="dark section"><div class="wrap video"><div><div class="eyebrow" style="color:#7bc497">${esc(ap.eyebrow)}</div><h2>${esc(ap.title)}</h2><p style="color:#ffffff99;line-height:1.8">${esc(ap.subtitle)}</p><a class="btn" style="margin-top:20px" href="${esc(ap.ctaHref||'#contact')}">${esc(ap.ctaLabel||'Contact us')}</a></div><div class="grid" style="grid-template-columns:1fr;gap:12px">${steps.map((s,i)=>`<div class="card" style="background:#ffffff0d;border-color:#ffffff1a;color:#fff"><div style="font-size:30px;font-weight:900;color:#7bc497">${String(i+1).padStart(2,'0')}</div><h3>${esc(s.title)}</h3><p style="color:#ffffff80">${esc(s.text)}</p></div>`).join('')}</div></div></section>`;
  const team=on(c.directorAndTeam&&c.directorAndTeam.members);
  if(enabled(c.directorAndTeam)&&team.length)h+=section('director',(c.directorAndTeam.eyebrow||'Our team'),(c.directorAndTeam.title||'Meet the team'),`<p style="max-width:640px;color:#0b1b3d99;line-height:1.8">${esc(c.directorAndTeam.subtitle||'')}</p><div class="grid team" style="margin-top:24px">${team.map(m=>`<article class="card">${m.imageUrl?`<img src="${esc(m.imageUrl)}" alt="${esc(m.name)}">`:''}<h3>${esc(m.name)}</h3><p style="color:var(--green);font-weight:bold">${esc(m.title)}</p><p>${esc(m.bio)}</p></article>`).join('')}</div>`);
  const gal=on(c.gallery&&c.gallery.items);
  if(enabled(c.gallery)&&gal.length)h+=section('gallery',(c.gallery.eyebrow||'Gallery'),(c.gallery.title||'Gallery'),`<div class="gallery">${gal.map(g=>`<figure><img src="${esc(g.imageUrl)}" alt="${esc(g.caption)}">${g.caption?`<figcaption>${esc(g.caption)}</figcaption>`:''}</figure>`).join('')}</div>`);
  const vids=on(c.highlightedVideo&&c.highlightedVideo.items);
  if(enabled(c.highlightedVideo)&&vids.length)h+=`<section id="insights" class="wrap section"><div class="eyebrow">${esc(c.highlightedVideo.eyebrow||'Advisory insights')}</div><h2>${esc(c.highlightedVideo.title||'Briefings')}</h2>${vids.map(v=>`<div class="video" style="margin-bottom:40px"><div><h3 style="font-size:26px;margin:0 0 10px">${esc(v.title)}</h3><p style="color:#0b1b3d99;line-height:1.8">${esc(v.description)}</p></div><iframe src="${esc(v.embedUrl)}" title="${esc(v.title)}" loading="lazy" allowfullscreen></iframe></div>`).join('')}${tst(c)}</section>`;
  else h+=`<section id="insights" class="wrap section">${tst(c)}</section>`;
  const posts=on(c.posts&&c.posts.items);
  if(enabled(c.posts)&&posts.length)h+=section('posts',(c.posts.eyebrow||'Insights & guides'),(c.posts.title||'Latest'),`<div class="grid">${posts.map(p=>`<article class="card posts"><small>${esc(p.category)}</small><h3>${esc(p.title)}</h3><p style="color:#0b1b3d80">${esc(p.publicationDate)}</p><a href="${esc(p.downloadUrl||'#contact')}" style="color:var(--green);font-weight:bold">Read / Download →</a></article>`).join('')}</div>`);
  const faq=on(c.faqs&&c.faqs.items);
  if(enabled(c.faqs)&&faq.length)h+=`<section class="wrap section faq"><div class="eyebrow">${esc(c.faqs.eyebrow||'FAQ')}</div><h2>${esc(c.faqs.title||'Questions, answered.')}</h2>${faq.map((f,i)=>`<div class="row"><button onclick="nbaToggle(${i})"><span>${esc(f.question)}</span><span style="color:var(--green)">▾</span></button><div class="ans" id="faq-${i}" style="display:none">${esc(f.answer)}</div></div>`).join('')}</section>`;
  const ct=c.contact||{};
  if(enabled(ct))h+=`<section id="contact" class="dark section"><div class="wrap video"><div><div class="eyebrow" style="color:#7bc497">${esc(ct.eyebrow)}</div><h2>${esc(ct.title)}</h2><p style="color:#fff9;line-height:1.8">${esc(ct.subtitle)}</p><p style="margin-top:18px;color:#ffffffcc">${esc(ct.note)}</p><p style="margin-top:18px;color:#ffffffcc">${ct.address?`📍 ${esc(ct.address)}<br>`:''}${ct.email?`✉️ ${esc(ct.email)}<br>`:''}${ct.phone?`📞 ${esc(ct.phone)}`:''}</p></div><form action="https://api.web3forms.com/submit" method="POST" class="card"><input type="hidden" name="access_key" value="YOUR_WEB3FORMS_ACCESS_KEY"><input required name="name" placeholder="Your name" style="width:100%;padding:14px;margin-bottom:12px;border:1px solid #0b1b3d1a;border-radius:12px"><input required type="email" name="email" placeholder="Email address" style="width:100%;padding:14px;margin-bottom:12px;border:1px solid #0b1b3d1a;border-radius:12px"><textarea required name="message" placeholder="How can we help?" rows="5" style="width:100%;padding:14px;margin-bottom:12px;border:1px solid #0b1b3d1a;border-radius:12px"></textarea><button class="btn" type="submit">Send enquiry</button></form></div></section>`;
  h+='</main>';
  const f=c.footer||{};
  if(enabled(f))h+=`<footer><div class="wrap"><strong>${esc(f.brandName)}</strong> · ${esc(f.tagline)}<br><small style="color:#fff8">${esc(f.note)}</small><p style="color:#ffffff4d;font-size:12px;margin-top:18px">${esc(f.copyright)}</p></div></footer>`;
  return h;
}
function tst(c){const t=on(c.testimonials&&c.testimonials.items);if(!enabled(c.testimonials)||!t.length)return '';return `<div style="margin-top:60px"><div class="eyebrow">${esc(c.testimonials.eyebrow||'Testimonials')}</div><h2>${esc(c.testimonials.title||'What clients say')}</h2><div class="grid quotes">${t.map(x=>`<article class="card"><p>“${esc(x.quote)}”</p><strong>${esc(x.clientName)}</strong><br><small style="color:#0b1b3d80">${esc(x.company)}</small></article>`).join('')}</div></div>`}
window.nbaToggle=function(i){const el=document.getElementById('faq-'+i);if(el)el.style.display=el.style.display==='none'?'block':'none';};
function notice(c){if(!enabled(c.notificationPopup))return;if(sessionStorage.getItem('nba_notice')==='seen')return;const n=c.notificationPopup;document.querySelector('#notice').innerHTML=`<div class="modal"><div class="modalbox"><button class="close" onclick="this.closest('.modal').remove()">×</button><div class="eyebrow">NBA update</div><h2>${esc(n.title)}</h2><p>${esc(n.message)}</p><a class="btn" href="${esc(n.documentUrl)}" onclick="sessionStorage.setItem('nba_notice','seen')">${esc(n.buttonLabel)}</a></div></div>`}
function upsertMeta(attr,key,value){if(!value)return;let el=document.head.querySelector(`meta[${attr}="${key}"]`);if(!el){el=document.createElement('meta');el.setAttribute(attr,key);document.head.appendChild(el)}el.setAttribute('content',value)}
function applySeo(c){const s=c.seo;if(!s||s.enabled===false)return;if(s.title)document.title=s.title;upsertMeta('name','description',s.description);upsertMeta('name','keywords',s.keywords);upsertMeta('property','og:title',s.title);upsertMeta('property','og:description',s.description);upsertMeta('property','og:image',s.ogImage)}
let latest='',booted=false;
async function load(){try{const r=await fetch('/api/content',{cache:'no-store'});const data=await r.json();const sig=JSON.stringify(data);if(sig!==latest){latest=sig;document.querySelector('#app').innerHTML=build(data);applySeo(data);if(!booted)notice(data);booted=true;if(latest&&document.querySelector('#toast')){const t=document.querySelector('#toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}}}catch(e){if(!booted)document.querySelector('#app').innerHTML='<div style="padding:60px;text-align:center;font-family:Arial">Content API unavailable. Start the CMS server with <b>node server.js</b>.</div>'}}
load();setInterval(load,5000);
</script></body></html>
