<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NBA Content Studio</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-slate-100 text-[#0b1b3d]"><main class="mx-auto max-w-6xl p-5 md:p-10"><header class="mb-8 flex flex-wrap items-end justify-between gap-4"><div><p class="text-xs font-bold uppercase tracking-[.2em] text-[#6e0e14]">Nakshatra Business Advisory</p><h1 class="mt-2 text-4xl font-black">Content Studio</h1><p class="mt-2 text-slate-500">Every section is editable. Add, reorder or remove items, upload files, then save to publish.</p></div><div class="flex items-center gap-3"><a href="/" target="_blank" class="rounded-full bg-white px-5 py-3 font-bold shadow-sm">Preview site ↗</a><button id="reload" class="rounded-full bg-white px-5 py-3 font-bold shadow-sm">Reload</button><button id="save" class="rounded-full bg-[#0a7e39] px-6 py-3 font-bold text-white shadow-lg">Save &amp; deploy</button></div></header><div id="status" class="mb-6 hidden rounded-xl p-4 text-sm"></div><nav id="jump" class="mb-6 flex flex-wrap gap-2"></nav><section class="mb-6 max-w-full rounded-3xl bg-white p-6 shadow-sm"><div class="mb-4 flex flex-wrap items-center justify-between gap-4"><h2 class="text-xl font-black">GitHub repository</h2><span id="git-badge" class="rounded-full bg-slate-100 px-3 py-1 text-xs font-bold uppercase tracking-wider text-slate-500">checking…</span></div><div class="grid gap-3 md:grid-cols-2"><label class="block text-sm font-semibold">Repository URL<input id="git-url" placeholder="https://github.com/owner/repo.git" class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-4 py-3 font-normal outline-none focus:border-[#0a7e39]"></label><label class="block text-sm font-semibold">Branch<input id="git-branch" value="main" class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-4 py-3 font-normal outline-none focus:border-[#0a7e39]"></label></div><p id="git-info" class="mt-3 text-sm text-slate-500">Create an empty repository on GitHub, paste its URL here, then save and push.</p><div class="mt-4 flex flex-wrap gap-3"><button type="button" id="git-setup" class="rounded-full bg-[#0a7e39] px-5 py-3 font-bold text-white shadow-sm">Save repository</button><button type="button" id="git-push" class="rounded-full bg-white px-5 py-3 font-bold shadow-sm">Push now</button><button type="button" id="git-refresh" class="rounded-full bg-white px-5 py-3 font-bold shadow-sm">Refresh status</button></div></section><form id="cms" class="grid gap-6"></form></main><script>
const labels={topBar:'Top bar',brand:'Brand',hero:'Hero',services:'Services',approach:'Our approach',directorAndTeam:'Director & team',achievements:'Achievements & metrics',highlightedVideo:'Highlighted video',gallery:'Gallery',testimonials:'Testimonials',posts:'Insights & guides',faqs:'FAQs',contact:'Contact',footer:'Footer',seo:'SEO & social',notificationPopup:'Notification popup'};
const fieldLabels={logoUrl:'Logo image',imageUrl:'Image',documentUrl:'PDF document',embedUrl:'YouTube embed URL',primaryHref:'Primary button link',secondaryHref:'Secondary button link',ctaHref:'Button link',downloadUrl:'PDF document',clientName:'Client name',mapUrl:'Google Map embed URL',mapTitle:'Map title',members:'Team members'};
const lockedPaths=new Set(['brand.name','brand.logoUrl','footer.brandName']);
let content;
let rev='';
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const pretty=k=>fieldLabels[k]||k.replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase());
function getPath(path){return path.split('.').reduce((t,p)=>t?.[p],content)}
function setPath(path,value){const parts=path.split('.');const target=parts.slice(0,-1).reduce((t,p)=>t[p],content);target[parts.at(-1)]=value}
function leaf(path,key,value){const isImage=/imageUrl$|logoUrl$|ogImage$/.test(key);const isPdf=/documentUrl$|downloadUrl$/.test(key);const wide=String(value).length>60;if(isPdf){const shown=value?`<a href="${esc(value)}" target="_blank" class="mt-2 block truncate text-sm font-normal text-[#0a7e39] underline">${esc(value)}</a>`:`<span class="mt-2 block text-sm font-normal text-slate-400">No document yet — upload a PDF.</span>`;return `<label class="md:col-span-2 block text-sm font-semibold">${esc(pretty(key))}${shown}<input type="file" data-upload="${path}" accept=".pdf" class="mt-2 block w-full text-sm"></label>`}const control=wide?`<textarea data-path="${path}" rows="2" class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-4 py-3 font-normal outline-none focus:border-[#0a7e39]">${esc(value)}</textarea>`:`<input data-path="${path}" value="${esc(value)}" class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-4 py-3 font-normal outline-none focus:border-[#0a7e39]">`;const upload=isImage?`<input type="file" data-upload="${path}" accept=".jpg,.jpeg,.png,.webp" class="mt-2 block w-full text-sm">`:'';const thumb=isImage&&value?`<img src="${esc(value)}" alt="" class="mt-2 h-16 w-auto rounded-lg border border-slate-200">`:'';return `<label class="${wide?'md:col-span-2 ':''}block text-sm font-semibold">${esc(pretty(key))}${control}${thumb}${upload}</label>`}
function toggle(path,key,value){return `<label class="flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-slate-500"><input type="checkbox" data-path="${path}" ${value?'checked':''}> ${esc(pretty(key))}</label>`}
function itemBody(path,item){if(item===null||typeof item!=='object')return `<div class="md:col-span-2">${leaf(path,'value',item)}</div>`;return Object.entries(item).filter(([k])=>!['id','enabled'].includes(k)).map(([k,v])=>Array.isArray(v)?`<div class="md:col-span-2">${list(path+'.'+k,k,v)}</div>`:typeof v==='object'&&v!==null?`<div class="md:col-span-2 rounded-xl border border-slate-200 p-4"><h4 class="mb-3 font-bold">${esc(pretty(k))}</h4><div class="grid gap-3 md:grid-cols-2">${object(path+'.'+k,v)}</div></div>`:typeof v==='boolean'?toggle(path+'.'+k,k,v):leaf(path+'.'+k,k,v)).join('')}
function list(path,key,arr){const cards=arr.map((item,i)=>{const p=path+'.'+i;const title=esc(item&&item.name||item&&item.title||item&&item.value||item&&item.caption||item&&item.question||'Item '+(i+1));const enabled=item&&typeof item==='object'&&'enabled' in item?`<label class="text-xs"><input type="checkbox" data-path="${p}.enabled" ${item.enabled?'checked':''}> enabled</label>`:'';const moves=`<button type="button" data-move="${path}" data-index="${i}" data-dir="-1" class="rounded-md border border-slate-200 px-2 text-xs ${i===0?'opacity-30':'hover:bg-slate-100'}" ${i===0?'disabled':''} title="Move up">▲</button><button type="button" data-move="${path}" data-index="${i}" data-dir="1" class="rounded-md border border-slate-200 px-2 text-xs ${i===arr.length-1?'opacity-30':'hover:bg-slate-100'}" ${i===arr.length-1?'disabled':''} title="Move down">▼</button>`;return `<div class="rounded-2xl border border-slate-200 p-4"><div class="mb-3 flex justify-between gap-3"><strong>${title}</strong><div class="flex items-center gap-3">${moves}${enabled}<button type="button" data-remove="${path}" data-index="${i}" class="text-xs font-bold text-[#6e0e14]">Remove</button></div></div><div class="grid gap-3 md:grid-cols-2">${itemBody(p,item)}</div></div>`}).join('');return `<div class="grid gap-4">${cards}<button type="button" data-add="${path}" class="rounded-xl border-2 border-dashed border-slate-300 px-4 py-3 text-sm font-bold text-[#0a7e39]">+ Add ${esc(pretty(key).toLowerCase())}</button></div>`}
function object(path,obj){return Object.entries(obj).filter(([k])=>!lockedPaths.has(path+'.'+k)).map(([k,v])=>v===null?'':Array.isArray(v)?`<div class="md:col-span-2">${list(path+'.'+k,k,v)}</div>`:typeof v==='object'?`<div class="md:col-span-2 rounded-xl border border-slate-200 p-4"><h3 class="mb-3 font-bold">${esc(pretty(k))}</h3><div class="grid gap-3 md:grid-cols-2">${object(path+'.'+k,v)}</div></div>`:typeof v==='boolean'?toggle(path+'.'+k,k,v):leaf(path+'.'+k,k,v)).join('')}
function section(key){const data=content[key];const stamp=typeof data==='object'&&data&&'enabled' in data?`<label class="flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-slate-500"><input type="checkbox" data-path="${key}.enabled" ${data.enabled?'checked':''}> Visible</label>`:'';return `<section id="sec-${key}" class="max-w-full rounded-3xl bg-white p-6 shadow-sm"><div class="mb-5 flex items-center justify-between gap-4"><h2 class="text-xl font-black">${esc(labels[key]||pretty(key))}</h2>${stamp}</div><div class="grid gap-3 md:grid-cols-2">${object(key,data)}</div></section>`}
function anchor(key){return `<a href="#sec-${key}" class="rounded-full bg-white px-3 py-1.5 text-xs font-bold shadow-sm">${esc(labels[key]||pretty(key))}</a>`}
function blankFrom(item){if(!item||typeof item!=='object'||Array.isArray(item))return '';const out={};for(const [k,v] of Object.entries(item)){if(k==='id')continue;out[k]=k==='enabled'?true:typeof v==='boolean'?false:''}out.id='item-'+Date.now();return out}
function addItem(path){const arr=getPath(path);arr.push(blankFrom(arr[0])||'');markDirty();render()}
function removeItem(path,index){getPath(path).splice(index,1);markDirty();render()}
function moveItem(path,index,dir){const arr=getPath(path);const to=index+dir;if(to<0||to>=arr.length)return;[arr[index],arr[to]]=[arr[to],arr[index]];markDirty();render()}
let dirty=false;
function markDirty(){dirty=true;const s=document.querySelector('#save');if(s)s.textContent='Save & deploy •'}
function markClean(){dirty=false;const s=document.querySelector('#save');if(s)s.textContent='Save & deploy'}
function render(){document.querySelector('#cms').innerHTML=Object.keys(content).map(section).join('');document.querySelector('#jump').innerHTML=Object.keys(content).map(anchor).join('')}
document.querySelector('#cms').addEventListener('input',e=>{const el=e.target;if(!el.dataset.path)return;setPath(el.dataset.path,el.type==='checkbox'?el.checked:el.value);markDirty()});
document.querySelector('#cms').addEventListener('click',e=>{const a=e.target.closest('[data-add]');if(a){addItem(a.dataset.add);return}const r=e.target.closest('[data-remove]');if(r){removeItem(r.dataset.remove,Number(r.dataset.index));return}const m=e.target.closest('[data-move]');if(m){moveItem(m.dataset.move,Number(m.dataset.index),Number(m.dataset.dir))}});
document.querySelector('#cms').addEventListener('change',async e=>{const el=e.target;if(!el.dataset.upload||!el.files[0])return;const body=new FormData();body.append('file',el.files[0]);const result=await fetch('/api/upload',{method:'POST',body}).then(r=>r.json());if(result.ok){setPath(el.dataset.upload,result.url);markDirty();render();show('Upload complete. Save to publish it.',true)}else{show(result.error||'Upload failed.',false)}});
function show(message,ok){const el=document.querySelector('#status');el.textContent=message;el.className=`mb-6 rounded-xl p-4 text-sm ${ok?'bg-emerald-100 text-emerald-800':'bg-red-100 text-red-800'}`}
document.querySelector('#save').onclick=async()=>{const res=await fetch('/api/content',{method:'POST',headers:{'Content-Type':'application/json','X-Content-Rev':rev},body:JSON.stringify(content)});const result=await res.json();if(result.conflict){content=result.content;rev=res.headers.get('X-Content-Rev')||rev;markClean();render();show('Content changed elsewhere — reloaded latest. Review and save again.',false);return}if(result.ok){markClean();rev=res.headers.get('X-Content-Rev')||rev;const g=result.git||{};show('Saved. '+(g.message||'Deployed.'),true)}else{show('Error: '+result.error,false)}};
document.querySelector('#reload').onclick=()=>{if(dirty&&!confirm('Discard unsaved changes?'))return;init()};
if(typeof window!=='undefined')window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
function gitBadge(text,ok){const b=document.querySelector('#git-badge');b.textContent=text;b.className=`rounded-full px-3 py-1 text-xs font-bold uppercase tracking-wider ${ok?'bg-emerald-100 text-emerald-700':'bg-red-100 text-red-700'}`}
async function gitRefresh(){try{const r=await fetch('/api/git').then(r=>r.json());const s=r.status||{};document.querySelector('#git-url').value=s.remote||'';document.querySelector('#git-branch').value=s.branch||'main';if(!s.isRepo){gitBadge('no repository',false);document.querySelector('#git-info').textContent='Not a git repository yet — saving will initialize one and add the remote.';return}if(!s.remote){gitBadge('no remote',false);document.querySelector('#git-info').textContent='Local repo has no origin remote. Paste your GitHub URL and save.';return}const flow=[s.ahead?`↑${s.ahead} ahead`:'',s.behind?`↓${s.behind} behind`:'',s.hasChanges?'uncommitted changes':'clean'].filter(Boolean).join(' · ');gitBadge('connected',true);document.querySelector('#git-info').textContent=`origin → ${s.remote} (${s.branch}) · ${flow}${s.lastCommit?` · last: ${s.lastCommit}`:''}`}catch{gitBadge('unavailable',false)}}
document.querySelector('#git-refresh').onclick=gitRefresh;
document.querySelector('#git-setup').onclick=async()=>{const url=document.querySelector('#git-url').value.trim();const branch=document.querySelector('#git-branch').value.trim()||'main';const result=await fetch('/api/git/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,branch})}).then(r=>r.json());show(result.ok?(result.message||'Repository configured.'):('Error: '+(result.error||'Could not configure repository.')),!!result.ok);gitRefresh()};
document.querySelector('#git-push').onclick=async()=>{const result=await fetch('/api/git/push',{method:'POST'}).then(r=>r.json());show(result.ok?(result.message||'Pushed.'):('Error: '+(result.message||result.error||'Push failed.')),!!result.ok);gitRefresh()};
async function init(){const r=await fetch('/api/content');rev=r.headers.get('X-Content-Rev')||'';content=await r.json();markClean();render();gitRefresh()}
init();
</script></body></html>
