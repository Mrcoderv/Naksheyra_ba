<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NBA Content Studio</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-slate-100 text-[#0b1b3d]"><main class="mx-auto max-w-6xl p-5 md:p-10"><header class="mb-8 flex flex-wrap items-end justify-between gap-4"><div><p class="text-xs font-bold uppercase tracking-[.2em] text-[#6e0e14]">Nakshatra Business Advisory</p><h1 class="mt-2 text-4xl font-black">Content Studio</h1><p class="mt-2 text-slate-500">Manage every public section from one local JSON-backed dashboard.</p></div><button id="save" class="rounded-full bg-[#0a7e39] px-6 py-3 font-bold text-white shadow-lg">Save & deploy</button></header><div id="status" class="mb-6 hidden rounded-xl p-4 text-sm"></div><form id="cms" class="grid gap-6 lg:grid-cols-2"></form></main><script>
const labels={notificationPopup:'Notification popup',directorAndTeam:'Director & team',achievements:'Achievements & metrics',testimonials:'Testimonials',services:'Services',highlightedVideo:'Highlighted video',posts:'Insights & guides'};let content;
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function field(path,label,value,wide=false){return `<label class="${wide?'md:col-span-2':''} block text-sm font-semibold">${label}<input data-path="${path}" value="${esc(value)}" class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-4 py-3 font-normal outline-none focus:border-[#0a7e39]"></label>`}
function section(key){const data=content[key];let html=`<section class="rounded-3xl bg-white p-6 shadow-sm"><div class="mb-5 flex items-center justify-between"><h2 class="text-xl font-black">${labels[key]}</h2><label class="flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-slate-500"><input type="checkbox" data-path="${key}.enabled" ${data.enabled?'checked':''}> Enabled</label></div>`;
if(key==='notificationPopup')html+=`<div class="grid gap-4 md:grid-cols-2">${field(key+'.title','Headline',data.title)}${field(key+'.buttonLabel','Button label',data.buttonLabel)}${field(key+'.message','Message',data.message,true)}${field(key+'.documentUrl','PDF URL',data.documentUrl,true)}<label class="text-sm font-semibold md:col-span-2">Upload notice PDF<input type="file" data-upload="notificationPopup.documentUrl" accept=".pdf" class="mt-2 block w-full text-sm"></label></div>`;
if(key==='highlightedVideo')html+=`<div class="grid gap-4">${field(key+'.title','Title',data.title)}${field(key+'.embedUrl','YouTube embed URL',data.embedUrl)}${field(key+'.description','Description',data.description,true)}</div>`;
if(['directorAndTeam','achievements','testimonials','services','posts'].includes(key)){html+=`<div class="grid gap-4">${data.items.map((item,i)=>`<div class="rounded-2xl border border-slate-200 p-4"><div class="mb-3 flex justify-between"><strong>${item.name||item.title||item.value||'Item '+(i+1)}</strong><label class="text-xs"><input type="checkbox" data-path="${key}.items.${i}.enabled" ${item.enabled?'checked':''}> enabled</label></div><div class="grid gap-3 md:grid-cols-2">${Object.entries(item).filter(([k])=>!['id','enabled','imageUrl'].includes(k)).map(([name,value])=>field(`${key}.items.${i}.${name}`,name.replace(/([A-Z])/g,' $1'),value,name==='bio'||name==='details'||name==='quote')).join('')}${key==='directorAndTeam'?`<label class="text-sm font-semibold">Profile image<input type="file" data-upload="${key}.items.${i}.imageUrl" accept=".jpg,.jpeg,.png,.webp" class="mt-2 block w-full text-sm"></label>`:''}</div></div>`).join('')}</div>`} return html+'</section>'}
async function init(){content=await fetch('/api/content').then(r=>r.json());document.querySelector('#cms').innerHTML=Object.keys(labels).map(section).join('')}
function setPath(path,value){const parts=path.split('.');let target=content;parts.slice(0,-1).forEach(p=>target=target[p]);target[parts.at(-1)]=value}
document.querySelector('#cms').addEventListener('input',e=>{const el=e.target;if(!el.dataset.path)return;setPath(el.dataset.path,el.type==='checkbox'?el.checked:el.value)})
document.querySelector('#cms').addEventListener('change',async e=>{const el=e.target;if(!el.dataset.upload||!el.files[0])return;const body=new FormData();body.append('file',el.files[0]);const result=await fetch('/api/upload',{method:'POST',body}).then(r=>r.json());if(result.ok){setPath(el.dataset.upload,result.url);show('Upload complete. Save to publish it.',true)}})
function show(message,ok){const el=document.querySelector('#status');el.textContent=message;el.className=`mb-6 rounded-xl p-4 text-sm ${ok?'bg-emerald-100 text-emerald-800':'bg-red-100 text-red-800'}`}
document.querySelector('#save').onclick=async()=>{const result=await fetch('/api/content',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(content)}).then(r=>r.json());show(result.ok?'Content saved. Git deployment command completed or was skipped by the server.':result.error,result.ok)};init();
</script></body></html>
